<div class="chat-container">
  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen">
    <div class="chat-header">
      <h4>LangChain Assistant</h4>
      <button class="close-btn" (click)="toggleChat()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="chat-messages" #scrollContainer>
      <div *ngFor="let msg of messages" [class]="'message ' + msg.role">
        {{ msg.text }}
      </div>
      <div class="typing" *ngIf="isLoading">AI is thinking...</div>
    </div>

    <div class="chat-input-area">
      <input 
        type="text" 
        class="chat-input" 
        placeholder="Type a message..." 
        [(ngModel)]="userInput"
        (keyup.enter)="sendMessage()"
        [disabled]="isLoading"
      >
      <button class="send-btn" (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <!-- Floating Bubble -->
  <div class="chat-bubble" (click)="toggleChat()" *ngIf="!isOpen">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </div>
</div>
