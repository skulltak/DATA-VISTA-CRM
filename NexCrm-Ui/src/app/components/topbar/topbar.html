<header class="topbar">
  <div class="topbar-left">
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" (click)="onHamburgerClick()">
      <span></span><span></span><span></span>
    </button>
    <div class="breadcrumb" id="breadcrumb">{{ breadcrumb }}</div>
  </div>
  <div class="topbar-right">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="text" id="globalSearch" placeholder="Search records…"/>
    </div>
    <button class="icon-btn" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="badge">3</span>
    </button>
  </div>
</header>
