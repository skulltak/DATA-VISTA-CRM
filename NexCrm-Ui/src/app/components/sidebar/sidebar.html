<aside class="sidebar" [class.open]="isOpen" id="sidebar">
  <div class="sidebar-logo">
    <div class="signal-button" *ngIf="dbStatus" 
         [style.background]="dbStatus === 'connected' ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.15)'"
         [style.border]="dbStatus === 'connected' ? '1px solid rgba(34, 197, 94, 0.4)' : '1px solid rgba(239, 68, 68, 0.4)'"
         style="display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700; padding: 10px 16px; border-radius: 6px; margin: 10px; width: calc(100% - 20px);">
      <span class="signal-dot" 
            [style.color]="dbStatus === 'connected' ? '#22c55e' : '#ef4444'" 
            style="width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; display: inline-block;"></span>
      <span class="signal-label" 
            [style.color]="dbStatus === 'connected' ? '#22c55e' : '#ef4444'" 
            style="letter-spacing: 1px;">
        MONGO DB: {{ dbStatus === 'connected' ? 'CONNECTED' : 'DISCONNECTED' }}
      </span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">OVERVIEW</div>
    <div class="nav-section-label">NAVIGATE</div>
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard <span class="badge badge-info">NEW</span>
    </a>

    <div class="nav-section-label">DATA_ENGINE</div>
    <a class="nav-item" routerLink="/file-viewer" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      File Voyager
    </a>
    <a class="nav-item" routerLink="/fdss" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      FDSS
    </a>
    <a class="nav-item" (click)="openVistaPortal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
      Vista Portal
    </a>

    <div class="nav-section-label">EXTRA</div>
    <a class="nav-item logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log Out
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-avatar">KU</div>
    <div class="user-info">
      <div class="user-name">Kunal</div>
      <div class="user-role">Admin</div>
    </div>
  </div>
</aside>
